name: HU-ACT-010 verification

on:
  push:
    branches:
      - feat/hu-act-010-dev
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out actors-db develop for Liquibase integration tests
        uses: actions/checkout@v4
        with:
          repository: code-sena/design-software-actors-db
          ref: develop
          path: actors-db
          token: ${{ secrets.ACTORS_DB_READ_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn --version
          docker version
          docker info

      - name: Run unit and application tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run integration verification with Testcontainers
        env:
          ACTORS_DB_REPO_DIR: ${{ github.workspace }}/actors-db
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu-act-010-maven-reports
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*.dump
            **/target/*.dumpstream
