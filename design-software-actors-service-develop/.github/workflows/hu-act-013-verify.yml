name: HU-ACT-013 verification

on:
  push:
    branches: [hu-013-dev]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out actors-service
        uses: actions/checkout@v4
        with:
          path: actors-service

      - name: Check out actors-db develop for the real Liquibase changelog
        uses: actions/checkout@v4
        with:
          repository: code-sena/design-software-actors-db
          ref: develop
          path: actors-db
          token: ${{ secrets.ACTORS_DB_READ_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: actors-service/pom.xml

      - name: Verify Docker and run unit and integration tests
        working-directory: actors-service
        env:
          ACTORS_DB_REPO_DIR: ${{ github.workspace }}/actors-db
        run: |
          docker version
          mvn --batch-mode --no-transfer-progress verify

      - name: Upload Maven reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu-act-013-maven-reports
          if-no-files-found: warn
          path: |
            actors-service/**/target/surefire-reports/**
            actors-service/**/target/failsafe-reports/**
